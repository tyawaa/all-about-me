<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Poppins', sans-serif; fill: white; }
      .pill { rx:14; ry:14; fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.12); }
      .pill-text { font: 600 18px 'Poppins', sans-serif; fill: #e9d5ff; }
      .center-text { font: 700 28px 'Poppins', sans-serif; fill: url(#g); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020"/>
  <text x="60" y="64" class="title">ECO-SHIELD — Framework</text>
  <rect x="70" y="110" width="1060" height="120" class="pill"/>
  <text x="120" y="180" class="center-text">Drivers → Dimensi → Dampak → Strategi → SDGs</text>

  <!-- Pillars -->
  <g transform="translate(100,260)">
    <rect class="pill" x="0" y="0" width="240" height="80" />
    <text x="20" y="50" class="pill-text">Pilar 1 — Ecosystem Integrity</text>
  </g>
  <g transform="translate(380,260)">
    <rect class="pill" x="0" y="0" width="240" height="80" />
    <text x="20" y="50" class="pill-text">Pilar 2 — Pollution Control</text>
  </g>
  <g transform="translate(660,260)">
    <rect class="pill" x="0" y="0" width="240" height="80" />
    <text x="20" y="50" class="pill-text">Pilar 3 — Governance & Resilience</text>
  </g>
  <g transform="translate(940,260)">
    <rect class="pill" x="0" y="0" width="240" height="80" />
    <text x="20" y="50" class="pill-text">Pilar 4 — Data Monitoring</text>
  </g>

  <text x="60" y="560" font-size="12" fill="#9ca3af">(Placeholder diagram — replace with final artwork if available)</text>
