<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Cursor Demo</title>
    <link rel="stylesheet" href="css/cursor.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
        }

        h1 {
            color: #333;
            margin-bottom: 2rem;
        }

        .interactive-box {
            background-color: #4a90e2;
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 8px;
            margin: 1rem 0;
            display: inline-block;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .interactive-box:hover {
            background-color: #357abd;
            transform: translateY(-3px);
        }

        .button-group {
            margin: 2rem 0;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            margin: 0.5rem;
            border-radius: 4px;
            cursor: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .content-box {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
        }

        .link {
            color: #4a90e2;
            text-decoration: none;
            font-weight: bold;
            margin: 0 0.5rem;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: #357abd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Custom Cursor Demo</h1>
        
        <div class="interactive-box" data-cursor-hover>
            Arahkan kursor ke sini!
        </div>

        <div class="button-group">
            <button class="interactive">Tombol Interaktif</button>
            <button class="interactive">Coba Klik Saya</button>
        </div>

        <div class="content-box">
            <p>Ini adalah demo kursor kustom dengan berbagai efek interaktif.</p>
            <p>Coba arahkan kursor ke <a href="#" class="link">link ini</a> atau ke tombol-tombol di atas.</p>
            <p>Kursor akan berubah bentuk saat berada di atas elemen yang dapat diklik atau interaktif.</p>
        </div>
    </div>

    <script src="js/cursor.js"></script>
</body>
</html>
